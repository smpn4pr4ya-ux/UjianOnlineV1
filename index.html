<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tryout Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; background: #28a745; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #218838; }
        .hidden { display: none; }
        .question-card { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 6px; }
        .options { margin-top: 10px; }
        .options label { display: block; font-weight: normal; margin-bottom: 8px; cursor: pointer; }
        .timer { font-size: 18px; font-weight: bold; color: #dc3545; text-align: right; margin-bottom: 15px; }
        .result-box { background: #e9ecef; padding: 20px; border-radius: 6px; margin-top: 20px; text-align: center; }
        .explanation { background: #fff3cd; padding: 10px; border-left: 4px solid #ffc107; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM REGISTRASI -->
    <div id="login-section">
        <h1>Tryout Online SMP</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
            </div>
            <div class="form-group">
                <label for="kelas">Kelas:</label>
                <select id="kelas" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="7.1">7.1</option>
                    <option value="7.2">7.2</option>
                    <option value="7.3">7.3</option>
                    <option value="8.1">8.1</option>
                    <option value="8.2">8.2</option>
                    <option value="9.1">9.1</option>
                    <option value="9.2">9.2</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mapel">Mata Pelajaran:</label>
                <select id="mapel" required>
                    <option value="">-- Pilih Mata Pelajaran --</option>
                    <option value="pai">PAI (Pendidikan Agama Islam)</option>
                    <option value="pkn">PPKn</option>
                    <option value="indo">Bahasa Indonesia</option>
                    <option value="mtk">Matematika</option>
                    <option value="ipa">IPA</option>
                    <option value="ips">IPS</option>
                    <option value="inggris">Bahasa Inggris</option>
                    <option value="senbud">Seni Budaya</option>
                    <option value="pjok">PJOK</option>
                    <option value="prakarya">Prakarya</option>
                    <option value="sunda">Bahasa Daerah / Sunda</option>
                </select>
            </div>
            <button type="submit">Mulai Ujian</button>
        </form>
    </div>

    <!-- HALAMAN SOAL TRYOUT -->
    <div id="exam-section" class="hidden">
        <div class="timer" id="timer">Waktu Sisa: 30:00</div>
        <h2 id="exam-title">Soal Ujian</h2>
        <form id="exam-form">
            <div id="questions-container"></div>
            <button type="button" id="submit-btn" onclick="finishExam()">Selesaikan Ujian</button>
        </form>
    </div>

    <!-- HASIL TRYOUT & PEMBAHASAN -->
    <div id="result-section" class="hidden">
        <h2>Hasil Ujian</h2>
        <div class="result-box">
            <p><strong>Nama:</strong> <span id="res-nama"></span></p>
            <p><strong>Kelas:</strong> <span id="res-kelas"></span></p>
            <p><strong>Mata Pelajaran:</strong> <span id="res-mapel"></span></p>
            <h3 style="margin-top: 15px;">Nilai Anda: <span id="res-nilai" style="color: #0d6efd; font-size: 28px;">0</span> / 100</h3>
        </div>
        
        <h3 style="margin-top: 25px; margin-bottom: 15px;">Pembahasan Soal:</h3>
        <div id="explanations-container"></div>
        <button onclick="location.reload()">Ulangi / Kembali ke Form</button>
    </div>
</div>

<script>
    // Bank Soal Tryout Lengkap (11 Mata Pelajaran)
    const bankSoal = {
        // 1. PAI (Aksesibel untuk semua kelas 7.1, 7.2, 7.3, 8.1, 8.2, 9.1, 9.2)
        // Berisi 11 soal PG yang mencakup materi lengkap 11 mata pelajaran
        pai: [
            {
                q: "1. (PAI) Sifat wajib bagi Allah SWT 'As-Sami'' (السميع) memiliki arti bahwa Allah Maha ...",
                options: ["A. Melihat", "B. Mendengar", "C. Mengetahui", "D. Bijaksana"],
                ans: 1,
                exp: "As-Sami' adalah salah satu Asmaul Husna yang berarti Allah Maha Mendengar segala sesuatu."
            },
            {
                q: "2. (PPKn) Pancasila berfungsi sebagai cita-cita dan tujuan bangsa Indonesia. Hal ini menegaskan posisi Pancasila sebagai ...",
                options: ["A. Dasar Negara", "B. Pandangan Hidup Bangsa", "C. Ideologi Negara", "D. Kepribadian Bangsa"],
                ans: 2,
                exp: "Pancasila sebagai ideologi negara berfungsi memberi arah, cita-cita, dan tujuan pembangunan bangsa."
            },
            {
                q: "3. (Bahasa Indonesia) Teks yang menyajikan informasi secara objektif berdasarkan fakta yang ditemukan di lapangan disebut teks ...",
                options: ["A. Laporan Hasil Observasi", "B. Eksposisi", "C. Eksplanasi", "D. Narasi"],
                ans: 0,
                exp: "Teks Laporan Hasil Observasi (LHO) adalah teks yang menyampaikan informasi berdasarkan pengamatan fakta secara langsung."
            },
            {
                q: "4. (Matematika) Hasil dari -12 + 8 × (-3) adalah ...",
                options: ["A. -36", "B. 12", "C. -12", "D. -24"],
                ans: 0,
                exp: "Operasi perkalian didahulukan: 8 × (-3) = -24. Kemudian: -12 + (-24) = -36."
            },
            {
                q: "5. (IPA) Bagian sel tumbuhan yang berfungsi memberikan bentuk kaku dan melindungi isi sel adalah ...",
                options: ["A. Membran Sel", "B. Dinding Sel", "C. Sitoplasma", "D. Kloroplas"],
                ans: 1,
                exp: "Dinding sel terbuat dari selulosa yang keras, memberikan bentuk kaku dan perlindungan pada sel tumbuhan."
            },
            {
                q: "6. (IPS) Letak suatu wilayah berdasarkan garis lintang dan garis bujur pada peta disebut letak ...",
                options: ["A. Geografis", "B. Astronomis", "C. Geologis", "D. Geomorfologis"],
                ans: 1,
                exp: "Letak astronomis adalah posisi relatif suatu daerah berdasarkan garis koordinat lintang dan bujur."
            },
            {
                q: "7. (Bahasa Inggris) 'Listen! The principal ... a speech in the hall right now.'",
                options: ["A. gives", "B. gave", "C. is giving", "D. has given"],
                ans: 2,
                exp: "Keterangan waktu 'right now' dan 'Listen!' menandakan Present Continuous Tense (is/am/are + V-ing)."
            },
            {
                q: "8. (Seni Budaya) Teknik melukis dengan menggosokkan pensil atau krayon dalam posisi miring/tidur untuk menghasilkan efek gelap terang dinamakan teknik ...",
                options: ["A. Arsir", "B. Dussel", "C. Pointilis", "D. Sfondato"],
                ans: 1,
                exp: "Teknik dussel dilakukan dengan menggosokkan pensil/krayon (biasanya dimiringkan) untuk menciptakan gradasi atau bayangan."
            },
            {
                q: "9. (PJOK) Posisi awal badan yang benar saat melakukan gerakan guling depan (forward roll) adalah ...",
                options: ["A. Membelakangi matras", "B. Menghadap matras", "C. Menyampingi matras", "D. Tidur terlentang"],
                ans: 1,
                exp: "Awal gerakan guling depan dilakukan dengan posisi berdiri atau jongkok menghadap langsung ke matras."
            },
            {
                q: "10. (Prakarya) Bahan serat alam yang berasal dari tumbuhan dan paling sering dimanfaatkan untuk tekstil pembuat pakaian adalah ...",
                options: ["A. Kapas", "B. Eceng Gondok", "C. Pelepah Pisang", "D. Rotan"],
                ans: 0,
                exp: "Kapas diproses menjadi benang dan kain katun yang merupakan serat utama pembuatan produk tekstil."
            },
            {
                q: "11. (Bahasa Sunda) Carita rekaan nu wangunna pondok sarta ngandung unsur pamohalan (teu masuk akal) disebut ...",
                options: ["A. Dongéng", "B. Carpon", "C. Sajak", "D. Novel"],
                ans: 0,
                exp: "Dongéng nyaéta carita rekaan anu biasana ngandung hal-hal pamohalan atawa teu asup ku akal."
            }
        ],

        // Mapel Lainnya
        pkn: [
            {
                q: "Pancasila berfungsi sebagai cita-cita dan tujuan bangsa Indonesia. Hal ini menegaskan posisi Pancasila sebagai ...",
                options: ["A. Dasar Negara", "B. Pandangan Hidup Bangsa", "C. Ideologi Negara", "D. Kepribadian Bangsa"],
                ans: 2,
                exp: "Pancasila sebagai ideologi negara berfungsi memberi arah, cita-cita, dan tujuan pembangunan bangsa."
            }
        ],
        indo: [
            {
                q: "Teks yang menyajikan informasi secara objektif berdasarkan fakta yang ditemukan di lapangan disebut teks ...",
                options: ["A. Laporan Hasil Observasi", "B. Eksposisi", "C. Eksplanasi", "D. Narasi"],
                ans: 0,
                exp: "Teks Laporan Hasil Observasi (LHO) adalah teks yang menyampaikan informasi berdasarkan pengamatan fakta secara langsung."
            }
        ],
        mtk: [
            {
                q: "Hasil dari -12 + 8 × (-3) adalah ...",
                options: ["A. -36", "B. 12", "C. -12", "D. -24"],
                ans: 0,
                exp: "Operasi perkalian didahulukan: 8 × (-3) = -24. Kemudian: -12 + (-24) = -36."
            }
        ],
        ipa: [
            {
                q: "Bagian sel tumbuhan yang berfungsi memberikan bentuk kaku dan melindungi isi sel adalah ...",
                options: ["A. Membran Sel", "B. Dinding Sel", "C. Sitoplasma", "D. Kloroplas"],
                ans: 1,
                exp: "Dinding sel terbuat dari selulosa yang keras, memberikan bentuk kaku dan perlindungan pada sel tumbuhan."
            }
        ],
        ips: [
            {
                q: "Letak suatu wilayah berdasarkan garis lintang dan garis bujur pada peta disebut letak ...",
                options: ["A. Geografis", "B. Astronomis", "C. Geologis", "D. Geomorfologis"],
                ans: 1,
                exp: "Letak astronomis adalah posisi relatif suatu daerah berdasarkan garis koordinat lintang dan bujur."
            }
        ],
        inggris: [
            {
                q: "'Listen! The principal ... a speech in the hall right now.'",
                options: ["A. gives", "B. gave", "C. is giving", "D. has given"],
                ans: 2,
                exp: "Keterangan waktu 'right now' dan 'Listen!' menandakan Present Continuous Tense (is/am/are + V-ing)."
            }
        ],
        senbud: [
            {
                q: "Teknik melukis dengan menggosokkan pensil atau krayon dalam posisi miring/tidur untuk menghasilkan efek gelap terang dinamakan teknik ...",
                options: ["A. Arsir", "B. Dussel", "C. Pointilis", "D. Sfondato"],
                ans: 1,
                exp: "Teknik dussel dilakukan dengan menggosokkan pensil/krayon (biasanya dimiringkan) untuk menciptakan gradasi atau bayangan."
            }
        ],
        pjok: [
            {
                q: "Posisi awal badan yang benar saat melakukan gerakan guling depan (forward roll) adalah ...",
                options: ["A. Membelakangi matras", "B. Menghadap matras", "C. Menyampingi matras", "D. Tidur terlentang"],
                ans: 1,
                exp: "Awal gerakan guling depan dilakukan dengan posisi berdiri atau jongkok menghadap langsung ke matras."
            }
        ],
        prakarya: [
            {
                q: "Bahan serat alam yang berasal dari tumbuhan dan paling sering dimanfaatkan untuk tekstil pembuat pakaian adalah ...",
                options: ["A. Kapas", "B. Eceng Gondok", "C. Pelepah Pisang", "D. Rotan"],
                ans: 0,
                exp: "Kapas diproses menjadi benang dan kain katun yang merupakan serat utama pembuatan produk tekstil."
            }
        ],
        sunda: [
            {
                q: "Carita rekaan nu wangunna pondok sarta ngandung unsur pamohalan (teu masuk akal) disebut ...",
                options: ["A. Dongéng", "B. Carpon", "C. Sajak", "D. Novel"],
                ans: 0,
                exp: "Dongéng nyaéta carita rekaan anu biasana ngandung hal-hal pamohalan atawa teu asup ku akal."
            }
        ]
    };

    let currentQuestions = [];
    let timerInterval = null;
    let userData = {};

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        userData.nama = document.getElementById('nama').value;
        userData.kelas = document.getElementById('kelas').value;
        userData.mapelKey = document.getElementById('mapel').value;
        
        const mapelSelect = document.getElementById('mapel');
        userData.mapelName = mapelSelect.options[mapelSelect.selectedIndex].text;

        currentQuestions = bankSoal[userData.mapelKey] || [];

        if (currentQuestions.length === 0) {
            alert('Soal belum tersedia untuk mata pelajaran ini.');
            return;
        }

        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('exam-section').classList.remove('hidden');

        renderQuestions();
        startTimer(30 * 60); // 30 Menit
    });

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        currentQuestions.forEach((item, index) => {
            let optionsHtml = '';
            item.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label>
                        <input type="radio" name="q${index}" value="${optIndex}"> ${opt}
                    </label>
                `;
            });

            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <p><strong>Soal ${index + 1}:</strong> ${item.q}</p>
                <div class="options">${optionsHtml}</div>
            `;
            container.appendChild(card);
        });
    }

    function startTimer(duration) {
        let timer = duration;
        const timerDisplay = document.getElementById('timer');
        
        timerInterval = setInterval(function () {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            timerDisplay.textContent = "Waktu Sisa: " + minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(timerInterval);
                alert("Waktu ujian telah habis!");
                finishExam();
            }
        }, 1000);
    }

    function finishExam() {
        clearInterval(timerInterval);

        let scoreCount = 0;
        const userAnswers = [];

        currentQuestions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const ansValue = selected ? parseInt(selected.value) : -1;
            userAnswers.push(ansValue);

            if (ansValue === item.ans) {
                scoreCount++;
            }
        });

        const finalScore = Math.round((scoreCount / currentQuestions.length) * 100);

        document.getElementById('exam-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');

        document.getElementById('res-nama').textContent = userData.nama;
        document.getElementById('res-kelas').textContent = userData.kelas;
        document.getElementById('res-mapel').textContent = userData.mapelName;
        document.getElementById('res-nilai').textContent = finalScore;

        renderExplanations(userAnswers);
    }

    function renderExplanations(userAnswers) {
        const container = document.getElementById('explanations-container');
        container.innerHTML = '';

        currentQuestions.forEach((item, index) => {
            const userAns = userAnswers[index];
            const isCorrect = userAns === item.ans;
            
            let userAnsText = userAns !== -1 ? item.options[userAns] : "Tidak Dijawab";
            let correctAnsText = item.options[item.ans];

            const expCard = document.createElement('div');
            expCard.className = 'question-card';
            expCard.style.borderColor = isCorrect ? '#28a745' : '#dc3545';

            expCard.innerHTML = `
                <p><strong>Soal ${index + 1}:</strong> ${item.q}</p>
                <p>Jawaban Anda: <span style="color: ${isCorrect ? 'green' : 'red'}; font-weight:bold;">${userAnsText}</span></p>
                ${!isCorrect ? `<p>Jawaban Benar: <strong style="color: green;">${correctAnsText}</strong></p>` : ''}
                <div class="explanation">
                    <strong>Pembahasan:</strong> ${item.exp}
                </div>
            `;
            container.appendChild(expCard);
        });
    }
</script>

</body>
</html>
